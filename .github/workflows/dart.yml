name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify wordbook asset
        run: test -s assets/db/wordbook.db.gz

      - name: Verify Dart formatting
        shell: bash
        run: |
          find lib test -type f -name '*.dart' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed --line-length 120

      - name: Analyze project source
        # info 已清零（2026-09-26）：默认 fatal-infos / fatal-warnings，0 issue 才放行。
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub
