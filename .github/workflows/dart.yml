name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 最小权限基线：未显式声明 permissions 的 job 继承此 read-only。
permissions:
  contents: read

jobs:
  # 第四轮审计 M9（2026-11-17）：门禁步骤单一事实来源 = quality_gate.yml。
  #
  # ⚠️ 分支保护 required check 按**检查名精确匹配**（= analyze-and-test）。
  # reusable 调用（uses:）会把检查名上报为「调用方 job / 被调 job」，永远
  # 匹配不上原名（批16 实测 BLOCKED）；而本 job 又必须留在 dart.yml 里
  # 承载原名。故门禁步骤以 YAML 锚点从 quality_gate.yml 机械同步——
  # 改门禁只改 quality_gate.yml，然后运行 scripts/sync_ci_gate.py 同步本文件。
  # CI 的 sync 校验步骤会拦截「改了源头忘了同步」的漂移。
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dependency health report (non-blocking)
        # P3-9（架构审计 2026-11-12）：依赖健康可见性——列出落后/停更包。
        # 纯信息性，网络抖动或 pub 服务异常不阻断质量门禁；升级决策人工评估。
        continue-on-error: true
        run: flutter pub outdated --no-dev-dependencies || true

      - name: Verify wordbook asset
        # 第三轮 T32：非空但损坏的 gz 不得进 CI/正式包。gzip -t 校验压缩流
        # 完整性（不解压落盘，秒级）；Ubuntu runner 自带 gzip。
        run: |
          test -s assets/db/wordbook.db.gz
          gzip -t assets/db/wordbook.db.gz

      - name: Verify Dart formatting
        shell: bash
        run: |
          find lib test integration_test test_driver -type f -name '*.dart' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed --line-length 120

      - name: Analyze project source
        # info 已清零（2026-09-26）：默认 fatal-infos / fatal-warnings，0 issue 才放行。
        run: flutter analyze

      - name: Verify deploy/sync shell scripts
        shell: bash
        # auto_sync.sh 的守卫（R3-E03 改造 + 大文件拦截修复）。
        # 90MB 拦截是「构建产物/安装包塞进仓库」的唯一防线，纯 shell 真跑。
        run: |
          bash -n scripts/auto_sync.sh
          bash -n scripts/test_auto_sync_size_guard.sh
          bash scripts/test_auto_sync_size_guard.sh

      - name: Run tests
        # 审计 D5（2026-11-15）：flutter test 只跑 test/（单元/widget，内存 SQLite）。
        # integration_test/ 需真实设备，ubuntu runner 无设备无法执行，仅 format/analyze
        # 门禁；端到端真机验证列为 owner 待办。
        run: flutter test --no-pub

      - name: Verify gate steps in sync with quality_gate.yml
        # M9 漂移守卫：本 job 的步骤必须与单一事实来源逐字一致（注释除外）。
        run: python scripts/sync_ci_gate.py --check
