name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 最小权限基线：未显式声明 permissions 的 job 继承此 read-only，
# 仅 release job 按需提升为 contents: write。
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify wordbook asset
        run: test -s assets/db/wordbook.db.gz

      - name: Verify Dart formatting
        shell: bash
        run: |
          find lib test integration_test test_driver -type f -name '*.dart' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed --line-length 120

      - name: Analyze project source
        # info 已清零（2026-09-26）：默认 fatal-infos / fatal-warnings，0 issue 才放行。
        run: flutter analyze

      - name: Verify deploy/sync shell scripts
        shell: bash
        # auto_sync.sh 的守卫（R3-E03 改造 + 大文件拦截修复）。
        # 为什么必须进 CI：这道 90MB 拦截自 2026-08-31 事故后建立以来
        # **一直是空转的**（把 `git status --porcelain` 的整行当路径），
        # 而它是「构建产物/安装包塞进仓库」的唯一防线。
        # 纯 shell，不依赖 Flutter，在临时仓库里真跑脚本。
        run: |
          bash -n scripts/auto_sync.sh
          bash -n scripts/test_auto_sync_size_guard.sh
          bash scripts/test_auto_sync_size_guard.sh

      - name: Run tests
        run: flutter test --no-pub
