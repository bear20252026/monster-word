name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 最小权限基线：未显式声明 permissions 的 job 继承此 read-only。
permissions:
  contents: read

jobs:
  # 第四轮审计 M9（2026-11-17）：门禁步骤统一收敛到 quality_gate.yml
  # （reusable workflow，单一事实来源）。job 名保持 analyze-and-test——
  # 它是分支保护的 required check，改名会让 PR 永远等不到必需检查。
  analyze-and-test:
    uses: ./.github/workflows/quality_gate.yml
