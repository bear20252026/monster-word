name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder assets
        run: mkdir -p assets/db && echo placeholder > assets/db/wordbook.db.gz

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed --line-length 120 lib/ test/

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub
