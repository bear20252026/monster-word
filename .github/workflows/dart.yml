name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify wordbook asset
        run: test -s assets/db/wordbook.db.gz

      - name: Verify Dart formatting
        shell: bash
        run: |
          find lib test -type f -name '*.dart' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed --line-length 120

      - name: Analyze project source
        # Score90：warning 纳入阻断（当前库 warning=0）；info 暂不阻断（历史 lint）。
        # 规划：info 清零后改为 flutter analyze（默认 fatal-infos/warnings）。
        run: flutter analyze --no-fatal-infos

      - name: Analyze report (non-blocking infos)
        if: always()
        continue-on-error: true
        run: flutter analyze || true

      - name: Run tests
        run: flutter test --no-pub
