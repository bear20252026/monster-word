name: Release Packages

# 云端出包（承接 docs/release_pipeline.md §2）：
#   - 推送 tag v*        -> 构建双端产物并自动挂到 GitHub Release
#   - workflow_dispatch  -> 仅产出 Actions artifacts（手动验证）
# 产物：
#   Android -> MonsterWord_vX.Y.Z.apk + MonsterWord_vX.Y.Z.aab
#   Windows -> MonsterWord_Setup_vX.Y.Z.exe（Inno Setup 标准安装程序）
# 签名：
#   Android：设置 KEYSTORE_* secrets 则用正式 keystore 签名；否则回退 debug 签名并告警。

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

# 最小权限基线：未显式声明 permissions 的 job 继承此 read-only，
# 仅 release job 按需提升为 contents: write。
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # QUALITY GATE：analyze + 全量测试，任一失败则整个发版链熔断
  # --------------------------------------------------------------------
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      # MW-76：第三方 Action 固定到已审查的 commit SHA（供应链固定）。
      # R2-03：checkout 必须在任何读仓库文件的步骤之前——runner 的初始工作
      # 目录是空的，此前「先校验版本、后 checkout」会让 tag 构建在 sed
      # pubspec.yaml 时直接失败（main push 时该步被 if 跳过，故 CI 长期是绿的，
      # 只有正式打 tag 才会暴露）。请勿把下面的版本校验挪到本行之前。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # MW-70：tag 必须与 pubspec.yaml 版本一致（vX.Y.Z+N == X.Y.Z+N），
      # 防「Release 标签 v2.13.0、二进制实际 2.12.2」的可追溯性错误。
      - name: Verify tag matches pubspec version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n1 | tr -d '[:space:]')"
          echo "tag=$TAG pubspec=$PUBSPEC_VERSION"
          if [ "$TAG" != "$PUBSPEC_VERSION" ]; then
            echo "::error::tag 版本($TAG) 与 pubspec.yaml 版本($PUBSPEC_VERSION) 不一致，拒绝发版。"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

  # --------------------------------------------------------------------
  # ANDROID：生产 APK + AAB
  # --------------------------------------------------------------------
  android:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Configure release signing (from KEYSTORE_* secrets)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          IS_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$IS_TAG" != "$GITHUB_REF" ]; then
            # 安全审计 P2-2/P3-7：tag 即正式发版，产物必须真签名——
            # 缺 secrets 直接熔断，绝不产出 debug 签名的"正式"安装包。
            if [ -z "$KEYSTORE_STORE_PASSWORD" ]; then
              echo "::error::tag 构建缺少 KEYSTORE_* secrets，拒绝以 debug 签名发版。"
              exit 1
            fi
          fi
          if [ -n "$KEYSTORE_STORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/monster_word_release.jks
            printf 'storeFile=monster_word_release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_ALIAS" "$KEYSTORE_KEY_PASSWORD" \
              > android/key.properties
            echo "signed=release" >> "$GITHUB_ENV"
            echo "::notice::Using real release keystore from KEYSTORE_* secrets."
          else
            # 非 tag（main push / dispatch）且无 secrets -> 生成一次性 debug
            # keystore 仅供内部验证；产物文件名会带 -debugsigned 后缀标明。
            mkdir -p android/app
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "signed=debug" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_* secrets set -> generated a DEBUG-signed APK (artifact only)."
          fi

      - name: Install dependencies
        run: flutter pub get

      # MW-14/72：版本提取必须在构建【之前】——APP_VERSION/APP_BUILD_NUMBER
      # 以 dart-define 注入编译期常量（Sentry release/dist 与产物命名同源）。
      - name: Read app version (MW-72)
        shell: bash
        run: |
          full=$(sed -n 's/^version: *\([^ ]*\)/\1/p' pubspec.yaml | head -n1)
          ver=${full%+*}
          build=${full#*+}
          echo "android_version=$ver" >> "$GITHUB_ENV"
          echo "app_build=$build" >> "$GITHUB_ENV"

      - name: Build Release APK
        # 安全审计 P2-6：--obfuscate 提高逆向成本（含随包常量的提取门槛）
        # MW-14：APP_VERSION/APP_BUILD_NUMBER 注入编译期常量。
        # R2-01 阶段二（2026-10-14）：AUTH_BASE_URL 一注入，客户端即从「本机校验密码」
        #   切到「服务端校验」。**去掉这两个 define 就退回本机模式**，是切换/回退的唯一开关。
        # AUTH_ANON_KEY 不是密钥：anon key 本就随客户端二进制公开，且自建栈不校验它
        #   （只要求非空 —— 客户端靠「配置完整」判断是否切服务端模式）。
        #   切勿在这里放任何真实密钥：本仓库是公开仓。
        # 2026-10-15：STATS_BASE_URL 注入使用统计上报地址。与 AUTH_* 不同，**它缺失
        #   或不可达都不会影响任何用户可见行为**：统计开关默认关闭，且上报通道失败时
        #   只返回 false（数据留在本地等下轮补传），不会静默丢数据。
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_VERSION: ${{ env.android_version }}
          APP_BUILD_NUMBER: ${{ env.app_build }}
        run: >-
          flutter build apk --release --dart-define=SENTRY_DSN=$SENTRY_DSN
          --dart-define=APP_VERSION=$APP_VERSION --dart-define=APP_BUILD_NUMBER=$APP_BUILD_NUMBER
          --dart-define=AUTH_BASE_URL=https://auth.cloudbear.cloud
          --dart-define=AUTH_ANON_KEY=mw-selfhosted-1
          --dart-define=STATS_BASE_URL=https://stats.cloudbear.cloud
          --obfuscate --split-debug-info=build/symbols/apk

      - name: Build Release AAB
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_VERSION: ${{ env.android_version }}
          APP_BUILD_NUMBER: ${{ env.app_build }}
        run: >-
          flutter build appbundle --release --dart-define=SENTRY_DSN=$SENTRY_DSN
          --dart-define=APP_VERSION=$APP_VERSION --dart-define=APP_BUILD_NUMBER=$APP_BUILD_NUMBER
          --dart-define=AUTH_BASE_URL=https://auth.cloudbear.cloud
          --dart-define=AUTH_ANON_KEY=mw-selfhosted-1
          --dart-define=STATS_BASE_URL=https://stats.cloudbear.cloud
          --obfuscate --split-debug-info=build/symbols/aab

      - name: Rename packages to brand convention
        shell: bash
        run: |
          ver="$android_version"
          build="$app_build"
          # MW-72：产物文件名带 buildNumber——同版本号不同构建可凭文件名区分。
          # 安全审计 P2-2：debug 签名产物必须显式标记，防止被当作官方包分发
          if [ "$signed" = "debug" ]; then suffix="-debugsigned"; else suffix=""; fi
          cp build/app/outputs/flutter-apk/app-release.apk "MonsterWord_v${ver}+${build}${suffix}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "MonsterWord_v${ver}+${build}${suffix}.aab"

      - name: Verify APK signed by release certificate (MW-79)
        # 发版链里此前**不存在**「产物确由 release keystore 签名」的独立校验
        # （2026-10-15 审计 R3-E06：scripts/check_apk_signature.py 恒真、且没有被
        # 任何 workflow 引用）。这里真的解析 v2/v3 签名块、取出签名者证书、
        # 比对 SHA-256 指纹 —— 拿 debug 密钥签出来的包在这里就红，走不到 Release。
        # 证书轮换时必须同步改脚本里的 DEFAULT_EXPECTED（故意让它红）。
        shell: bash
        run: |
          set -euo pipefail
          apk="MonsterWord_v${android_version}+${app_build}.apk"
          if [ "${signed:-}" = "debug" ]; then
            echo "::warning::本次为 debug 签名产物（缺 KEYSTORE_* secrets），只打印指纹不做比对"
            python3 scripts/check_apk_signature.py "$apk" --print
          else
            python3 scripts/check_apk_signature.py "$apk"
          fi

      - name: Archive Android obfuscation symbols (MW-75)
        shell: bash
        run: |
          zip -qr build/debug-symbols-android.zip build/symbols/apk build/symbols/aab

      - name: Upload Android packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-packages
          path: |
            MonsterWord_v*.apk
            MonsterWord_v*.aab
            build/debug-symbols-android.zip

  # --------------------------------------------------------------------
  # WINDOWS：生产 Inno Setup 安装程序（.exe）
  # --------------------------------------------------------------------
  windows:
    needs: [quality-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        shell: pwsh
        run: |
          $full = (Get-Content pubspec.yaml | Select-String '^version: ').Line -replace 'version: ','' -replace '\s',''
          $ver = $full -replace '\+.*',''
          $build = $full -replace '.*\+',''
          echo "win_version=$ver" >> $env:GITHUB_ENV
          echo "win_build=$build" >> $env:GITHUB_ENV

      - name: Build Windows Release
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_VERSION: ${{ env.win_version }}
          APP_BUILD_NUMBER: ${{ env.win_build }}
        # 安全审计 P2-6：与 Android 一致开启混淆；MW-14：版本/构建号注入编译期常量
        # R2-01 阶段二：AUTH_BASE_URL 让客户端切到服务端校验（口径同上面的 APK 构建）
        # 2026-10-15：STATS_BASE_URL 同上（缺失/不可达均不影响用户可见行为）
        run: >-
          flutter build windows --release --dart-define=SENTRY_DSN=$env:SENTRY_DSN
          --dart-define=APP_VERSION=$env:APP_VERSION --dart-define=APP_BUILD_NUMBER=$env:APP_BUILD_NUMBER
          --dart-define=AUTH_BASE_URL=https://auth.cloudbear.cloud
          --dart-define=AUTH_ANON_KEY=mw-selfhosted-1
          --dart-define=STATS_BASE_URL=https://stats.cloudbear.cloud
          --obfuscate --split-debug-info=build/symbols/windows

      - name: Bundle VC++ Redistributable
        shell: pwsh
        run: |
          $dst = "build/windows/x64/runner/Release/vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $dst
          if (-not (Test-Path $dst)) { throw "vc_redist download failed" }
          # 安全审计 P3-6：校验 Authenticode 签名（必须为 Microsoft 签发且有效），
          # 防止 CDN/重定向被劫持的运行库以安装器权限静默执行。
          # 用签名校验而非固定 SHA256：aka.ms 短链恒指向最新版，硬编码哈希
          # 会在微软例行更新后过期熔断。
          $sig = Get-AuthenticodeSignature -FilePath $dst
          Write-Host "vc_redist signed by: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "vc_redist Authenticode signature invalid: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw "vc_redist not signed by Microsoft" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (ISCC)
        shell: pwsh
        run: |
          $ver = (Get-Content pubspec.yaml | Select-String '^version: ').Line -replace 'version: ','' -replace '\+.*',''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$ver installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename installer with build number (MW-72)
        shell: pwsh
        run: |
          $dir = 'build/installer'
          $build = '${{ env.win_build }}'
          # ⚠️ 原正则写的是 '_v(\d+\.\d+\.\d+)_'，**要求版本号后面跟下划线** ——
          # 而 Inno Setup 的产物是 `MonsterWord_Setup_v2.13.0.exe`（版本号后面是 `.exe`），
          # 于是整个步骤长期**空转**：Windows 安装包始终没有 buildNumber，
          # 与 Android 侧（`MonsterWord_v2.13.0+129.apk`）不一致，
          # MW-72「同版本号不同构建可凭文件名区分」在 Windows 侧从未生效。
          # 现在只锚到版本号本身，`+build` 插在它后面。
          Get-ChildItem $dir -Filter 'MonsterWord_Setup_v*.exe' | ForEach-Object {
            if ($_.Name -notmatch '\+\d+') {
              $newName = $_.Name -replace '_v(\d+\.\d+\.\d+)', ('_v$1+' + $build)
              Rename-Item $_.FullName -NewName $newName
              Write-Host "renamed to $newName"
            }
          }
          # 改名失败不该静默：产物名是发版可追溯性的一部分
          Get-ChildItem $dir -Filter 'MonsterWord_Setup_v*.exe' | ForEach-Object { $_.Name }
          if (-not (Get-ChildItem $dir -Filter 'MonsterWord_Setup_v*+*.exe')) {
            Write-Error "安装包改名未生效（找不到带 buildNumber 的产物名）"
          }

      # MW-16/73：Windows Authenticode 代码签名（预留步骤位）。
      #
      # 启用条件：购买代码签名证书后，把 PFX 的 base64 与密码写入仓库 secrets
      # WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD，本步骤自动生效。
      # 未配置时跳过并告警——产物为未签名安装包，Windows SmartScreen 会提示
      # 「未知发布者」（属已知上线前遗留项，见 docs/HANDOVER.md 待办）。
      - name: Check Windows signing secrets (MW-16/73)
        id: win_signing
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
            echo "available=false" >> $env:GITHUB_OUTPUT
            echo "::warning::未配置 WINDOWS_CERT_PFX_BASE64，跳过 Authenticode 签名（产物为未签名安装包）"
          } else {
            echo "available=true" >> $env:GITHUB_OUTPUT
          }

      - name: Sign installer (Authenticode, MW-16/73)
        if: steps.win_signing.outputs.available == 'true'
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))

          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw 'signtool.exe not found in Windows SDK' }

          $exes = Get-ChildItem 'build/installer' -Filter 'MonsterWord_Setup_v*.exe'
          if (-not $exes) { throw 'installer exe not found for signing' }

          foreach ($exe in $exes) {
            & $signtool sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($exe.Name)" }
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "$($exe.Name) signed by: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "installer signature invalid: $($sig.Status)" }
          }

          Remove-Item $pfx -Force

      - name: Archive obfuscation symbols (MW-75)
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/symbols/*' -DestinationPath 'build/debug-symbols.zip' -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer
          path: |
            build/installer/MonsterWord_Setup_v*.exe
            build/debug-symbols.zip

  # --------------------------------------------------------------------
  # RELEASE：仅 tag 触发，把双端产物挂到 GitHub Release
  # --------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Generate SHA256SUMS.txt (MW-71)
        shell: bash
        run: |
          cd artifacts
          # ⚠️ 清单里的路径必须是**扁平 basename**（2026-10-15 审计 R3-E04）。
          # GitHub Release 不支持目录，资产名就是 basename；而 find 出来的路径带
          # `android-packages/`、`windows-installer/installer/` 前缀 ⇒
          # 用户下载全部资产后 `sha256sum -c SHA256SUMS.txt` **每一行都 No such file**，
          # 这份清单 100% 不可用（v2.13.0+129 实测确认过）。
          find android-packages windows-installer -type f ! -name 'debug-symbols*' | sort \
            | xargs sha256sum | sed 's#  .*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # ⚠️ 必须用递归 glob（`**`）。2026-10-15 发 v2.13.0+129 时这里写的是单层
          # `artifacts/windows-installer/*`：windows job 的上传路径是
          # `build/installer/MonsterWord_Setup_v*.exe`，artifact 内因此嵌了一层
          # `installer/` ⇒ 单层 glob 只匹配到**目录**，而目录会被跳过 ⇒
          # **Windows 安装包没挂上 Release，整条流水线却全绿**。
          # （SHA256SUMS.txt 里仍有它，所以当时能凭校验和清单确认产物是好的。）
          files: |
            artifacts/android-packages/**
            artifacts/windows-installer/**
            artifacts/SHA256SUMS.txt
          # glob 一条都没匹配上就让 action 失败，别静默少挂产物（审计 R3-E05）。
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release assets (MW-77)
        # 防的就是上面那种「Release 建了但少挂产物」的静默故障：产物不齐必须让 job 红，
        # 而不是等人下载时才发现。四类各查一次 —— **符号包也要查**：
        # v2.13.0+129 实测就少了 android 的 debug-symbols-android.zip
        # （它在 artifact 的 build/ 子层，被同一次单层 glob 静默丢弃），
        # 而当时的校验只查 apk/aab/Setup.exe，所以没人发现（审计 R3-E05）。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⚠️ 本 job **不 checkout**（只下载 artifacts），而 `gh` 默认靠工作目录里的 git
          # remote 推断仓库 ⇒ 缺了它直接报 `failed to run git: fatal: not a git repository`
          # ⇒ 校验步骤必红（2026-10-17 v2.13.1+130 实测，此前所有 tag 构建都在这一步红）。
          # 显式指定仓库，不依赖 checkout。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | tee /tmp/assets.txt
          for pattern in '\.apk$' '\.aab$' 'Setup_v.*\.exe$' 'debug-symbols(-android)?\.zip$'; do
            if ! grep -qE "$pattern" /tmp/assets.txt; then
              echo "::error::Release 缺少匹配 $pattern 的产物 —— 三件套/符号包不齐"
              exit 1
            fi
          done
