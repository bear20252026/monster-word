name: Release Packages

# 云端出包（承接 docs/release_pipeline.md §2）：
#   - 推送 tag v*        -> 构建双端产物并自动挂到 GitHub Release
#   - workflow_dispatch  -> 仅产出 Actions artifacts（手动验证）
# 产物：
#   Android -> MonsterWord_vX.Y.Z.apk + MonsterWord_vX.Y.Z.aab
#   Windows -> MonsterWord_Setup_vX.Y.Z.exe（Inno Setup 标准安装程序）
# 签名：
#   Android：设置 KEYSTORE_* secrets 则用正式 keystore 签名；否则回退 debug 签名并告警。

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

# 最小权限基线：未显式声明 permissions 的 job 继承此 read-only，
# 仅 release job 按需提升为 contents: write。
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # QUALITY GATE：analyze + 全量测试，任一失败则整个发版链熔断
  # --------------------------------------------------------------------
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      # MW-70：tag 必须与 pubspec.yaml 版本一致（vX.Y.Z+N == X.Y.Z+N），
      # 防「Release 标签 v2.13.0、二进制实际 2.12.2」的可追溯性错误。
      - name: Verify tag matches pubspec version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n1 | tr -d '[:space:]')"
          echo "tag=$TAG pubspec=$PUBSPEC_VERSION"
          if [ "$TAG" != "$PUBSPEC_VERSION" ]; then
            echo "::error::tag 版本($TAG) 与 pubspec.yaml 版本($PUBSPEC_VERSION) 不一致，拒绝发版。"
            exit 1
          fi
      # MW-76：第三方 Action 固定到已审查的 commit SHA（供应链固定）。
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v7.0.0

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5d3655f3b8a5f11a5e7f55a1d8e81b92c # v2.19.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

  # --------------------------------------------------------------------
  # ANDROID：生产 APK + AAB
  # --------------------------------------------------------------------
  android:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v7.0.0

      - name: Setup JDK 17
        uses: actions/setup-java@dded088991c5b44dda4ff3ed3fa096acc5497a1b # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5d3655f3b8a5f11a5e7f55a1d8e81b92c # v2.19.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Configure release signing (from KEYSTORE_* secrets)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          IS_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$IS_TAG" != "$GITHUB_REF" ]; then
            # 安全审计 P2-2/P3-7：tag 即正式发版，产物必须真签名——
            # 缺 secrets 直接熔断，绝不产出 debug 签名的"正式"安装包。
            if [ -z "$KEYSTORE_STORE_PASSWORD" ]; then
              echo "::error::tag 构建缺少 KEYSTORE_* secrets，拒绝以 debug 签名发版。"
              exit 1
            fi
          fi
          if [ -n "$KEYSTORE_STORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/monster_word_release.jks
            printf 'storeFile=monster_word_release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_ALIAS" "$KEYSTORE_KEY_PASSWORD" \
              > android/key.properties
            echo "signed=release" >> "$GITHUB_ENV"
            echo "::notice::Using real release keystore from KEYSTORE_* secrets."
          else
            # 非 tag（main push / dispatch）且无 secrets -> 生成一次性 debug
            # keystore 仅供内部验证；产物文件名会带 -debugsigned 后缀标明。
            mkdir -p android/app
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "signed=debug" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_* secrets set -> generated a DEBUG-signed APK (artifact only)."
          fi

      - name: Install dependencies
        run: flutter pub get

      # MW-14/72：版本提取必须在构建【之前】——APP_VERSION/APP_BUILD_NUMBER
      # 以 dart-define 注入编译期常量（Sentry release/dist 与产物命名同源）。
      - name: Read app version (MW-72)
        shell: bash
        run: |
          full=$(sed -n 's/^version: *\([^ ]*\)/\1/p' pubspec.yaml | head -n1)
          ver=${full%+*}
          build=${full#*+}
          echo "android_version=$ver" >> "$GITHUB_ENV"
          echo "app_build=$build" >> "$GITHUB_ENV"

      - name: Build Release APK
        # 安全审计 P2-6：--obfuscate 提高逆向成本（含随包常量的提取门槛）
        # MW-14：APP_VERSION/APP_BUILD_NUMBER 注入编译期常量。
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_VERSION: ${{ env.android_version }}
          APP_BUILD_NUMBER: ${{ env.app_build }}
        run: >-
          flutter build apk --release --dart-define=SENTRY_DSN=$SENTRY_DSN
          --dart-define=APP_VERSION=$APP_VERSION --dart-define=APP_BUILD_NUMBER=$APP_BUILD_NUMBER
          --obfuscate --split-debug-info=build/symbols/apk

      - name: Build Release AAB
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_VERSION: ${{ env.android_version }}
          APP_BUILD_NUMBER: ${{ env.app_build }}
        run: >-
          flutter build appbundle --release --dart-define=SENTRY_DSN=$SENTRY_DSN
          --dart-define=APP_VERSION=$APP_VERSION --dart-define=APP_BUILD_NUMBER=$APP_BUILD_NUMBER
          --obfuscate --split-debug-info=build/symbols/aab

      - name: Rename packages to brand convention
        shell: bash
        run: |
          ver="$android_version"
          build="$app_build"
          # MW-72：产物文件名带 buildNumber——同版本号不同构建可凭文件名区分。
          # 安全审计 P2-2：debug 签名产物必须显式标记，防止被当作官方包分发
          if [ "$signed" = "debug" ]; then suffix="-debugsigned"; else suffix=""; fi
          cp build/app/outputs/flutter-apk/app-release.apk "MonsterWord_v${ver}+${build}${suffix}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "MonsterWord_v${ver}+${build}${suffix}.aab"

      - name: Archive Android obfuscation symbols (MW-75)
        shell: bash
        run: |
          zip -qr build/debug-symbols-android.zip build/symbols/apk build/symbols/aab

      - name: Upload Android packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.0
        with:
          name: android-packages
          path: |
            MonsterWord_v*.apk
            MonsterWord_v*.aab
            build/debug-symbols-android.zip

  # --------------------------------------------------------------------
  # WINDOWS：生产 Inno Setup 安装程序（.exe）
  # --------------------------------------------------------------------
  windows:
    needs: [quality-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v7.0.0

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5d3655f3b8a5f11a5e7f55a1d8e81b92c # v2.19.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        shell: pwsh
        run: |
          $full = (Get-Content pubspec.yaml | Select-String '^version: ').Line -replace 'version: ','' -replace '\s',''
          $ver = $full -replace '\+.*',''
          $build = $full -replace '.*\+',''
          echo "win_version=$ver" >> $env:GITHUB_ENV
          echo "win_build=$build" >> $env:GITHUB_ENV

      - name: Build Windows Release
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_VERSION: ${{ env.win_version }}
          APP_BUILD_NUMBER: ${{ env.win_build }}
        # 安全审计 P2-6：与 Android 一致开启混淆；MW-14：版本/构建号注入编译期常量
        run: >-
          flutter build windows --release --dart-define=SENTRY_DSN=$env:SENTRY_DSN
          --dart-define=APP_VERSION=$env:APP_VERSION --dart-define=APP_BUILD_NUMBER=$env:APP_BUILD_NUMBER
          --obfuscate --split-debug-info=build/symbols/windows

      - name: Bundle VC++ Redistributable
        shell: pwsh
        run: |
          $dst = "build/windows/x64/runner/Release/vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $dst
          if (-not (Test-Path $dst)) { throw "vc_redist download failed" }
          # 安全审计 P3-6：校验 Authenticode 签名（必须为 Microsoft 签发且有效），
          # 防止 CDN/重定向被劫持的运行库以安装器权限静默执行。
          # 用签名校验而非固定 SHA256：aka.ms 短链恒指向最新版，硬编码哈希
          # 会在微软例行更新后过期熔断。
          $sig = Get-AuthenticodeSignature -FilePath $dst
          Write-Host "vc_redist signed by: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "vc_redist Authenticode signature invalid: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw "vc_redist not signed by Microsoft" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (ISCC)
        shell: pwsh
        run: |
          $ver = (Get-Content pubspec.yaml | Select-String '^version: ').Line -replace 'version: ','' -replace '\+.*',''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$ver installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename installer with build number (MW-72)
        shell: pwsh
        run: |
          $dir = 'build/installer'
          $build = '${{ env.win_build }}'
          Get-ChildItem $dir -Filter 'MonsterWord_Setup_v*.exe' | ForEach-Object {
            if ($_.Name -notmatch '\+\d+') {
              $newName = $_.Name -replace '_v(\d+\.\d+\.\d+)_', ('_v$1+' + $build + '_')
              Rename-Item $_.FullName -NewName $newName
              Write-Host "renamed to $newName"
            }
          }

      - name: Archive obfuscation symbols (MW-75)
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/symbols/*' -DestinationPath 'build/debug-symbols.zip' -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.0
        with:
          name: windows-installer
          path: |
            build/installer/MonsterWord_Setup_v*.exe
            build/debug-symbols.zip

  # --------------------------------------------------------------------
  # RELEASE：仅 tag 触发，把双端产物挂到 GitHub Release
  # --------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v8.0.0
        with:
          path: artifacts

      - name: Generate SHA256SUMS.txt (MW-71)
        shell: bash
        run: |
          cd artifacts
          find android-packages windows-installer -type f ! -name 'debug-symbols*' | sort \
            | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddbfd4ce0b4d8f7c8f7b64baf9c370 # v3.0.0
        with:
          files: |
            artifacts/android-packages/*
            artifacts/windows-installer/*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
