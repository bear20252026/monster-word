name: Build Windows Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 最小权限基线：未显式声明 permissions 的 job 继承此 read-only，
# 仅 release job 按需提升为 contents: write。
permissions:
  contents: read

jobs:
  # 第四轮审计 M9（2026-11-17）：门禁统一走 quality_gate.yml——此前本 job
  # 只有 analyze+test，缺 format/gzip/脚本守卫（与 dart.yml 口径漂移）。
  # Windows 编译门禁保留在本文件（原生构建只有 windows runner 能跑）。
  quality-gate:
    uses: ./.github/workflows/quality_gate.yml

  build-windows:
    needs: [quality-gate]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        # 刻意**不**注入 AUTH_BASE_URL —— 这个 job 是「每次 push/PR 的编译与测试门禁」，
        # 产出的 artifact 不是发布件（无签名、无版本号、无安装器）。
        # 真正发出去的包由 release_packages.yml 构建，那里注入了 AUTH_BASE_URL（服务端模式）。
        # 留在这里保持本机模式还有一个好处：CI 同时覆盖了「不注入 define」这条路径，
        # 而它是合法的降级配置（本机模式），不该因为没被编译过而腐化。
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: monster-word-windows
          path: build/windows/x64/runner/Release/
