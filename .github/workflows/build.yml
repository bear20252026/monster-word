name: Build Windows Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 最小权限基线：未显式声明 permissions 的 job 继承此 read-only，
# 仅 release job 按需提升为 contents: write。
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --no-pub

      - name: Build Windows Release
        # 刻意**不**注入 AUTH_BASE_URL —— 这个 job 是「每次 push/PR 的编译与测试门禁」，
        # 产出的 artifact 不是发布件（无签名、无版本号、无安装器）。
        # 真正发出去的包由 release_packages.yml 构建，那里注入了 AUTH_BASE_URL（服务端模式）。
        # 留在这里保持本机模式还有一个好处：CI 同时覆盖了「不注入 define」这条路径，
        # 而它是合法的降级配置（本机模式），不该因为没被编译过而腐化。
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: monster-word-windows
          path: build/windows/x64/runner/Release/
